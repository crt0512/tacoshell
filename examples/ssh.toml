# an app that logs into a server over ssh. only [app] and one of [local] / [ssh]
# are required, everything else has a default. the full list of options with
# explanations is ../tacoshell.toml
# build with it: make CONFIG=examples/ssh.toml
#
# try it without a real server: cargo run --example dev_server
# then connect to 127.0.0.1:2222, any username, password "taco"

[app]
name = "Example"                   # window title, app menu name
id = "net.example.tacoshell-demo"   # reverse dns, names the settings folder and the macos bundle
binary = "example-app"             # what `make install` calls the binary
description = "An example app"
# icon = "icon.png"                # png, relative to this file, gets baked in

[terminal]
font_size = 14.0
cols = 120                         # starting window size in cells
rows = 35
foreground = "#cccccc"
background = "#181818"
term = "xterm-256color"            # TERM the app gets to see

[ssh]
# server = "example.com:22"        # bake one in and the setup screen stops asking for it
port = 22                          # used when the server has no port of its own
command = "htop"                   # run this instead of the login shell
# checkbox on the setup screen. checked = login shell, unchecked = `command`.
# leave it out and `command` always runs (or the login shell, if theres no command)
shell_toggle = { label = "Login shell", default = false }
# pin the servers key: nobody gets asked, anything else is refused.
# without it the first connect shows the fingerprint and asks
# host_keys = ["SHA256:..."]
connect_timeout_secs = 10
keepalive_secs = 5                 # poke the server after this much silence
keepalive_max = 3                  # this many unanswered pokes = connection interrupted
resume_every_secs = 3              # retry interval while the server cant be reached
reinit_after_secs = 5              # countdown before reinitializing a killed session
on_exit = "close"                  # app quit with status 0: "close", "reinitialize" or "login"
credentials = "memory"             # "memory", or "unsafe" to keep it in a file across relaunches
                                   # (base64, NOT encrypted, development only, the build warns)
# unsafe_warning = true            # with "unsafe": false hides the on screen warning

[login]
logo = """
Insert your ASCII art logo to show on the login screen here
If it breaks the toml or doesnt show up correctly use the logo_file option instead
"""
# logo_file = "logo.txt"           # or read it from a file, relative to this one
logo_color = "#e5a50a"
title = "log in to the example"

[menu]
open_on = "right_click"            # or "shift_right_click" to leave plain right clicks to the app

[kiosk]
enabled = false                    # always kiosk, otherwise only with --kiosk
fullscreen = true
# on screen keyboard rows, keys split by spaces, {name} for special keys:
# esc tab bksp enter shift ctrl space up down left right home end pgup pgdn del ins f1..f12
# keyboard = ["{esc} 1 2 3 ...", ...]
# keyboard_shift = [...]           # same shape as keyboard

# every string on screen can be changed here, `tacoshell --print-config`
# lists them all with their defaults. {placeholders} get filled in.
[text]
connect = "Log in"
lost_title = "Connection Lost..."
lost_body = "Reinitializing in {secs}s"
